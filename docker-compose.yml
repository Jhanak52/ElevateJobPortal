# Development infrastructure for Elevate Job Portal.
# Start the database only:   docker compose up -d
# Start database + web app:  docker compose --profile full up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elevatejobportal
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d elevatejobportal"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=elevatejobportal;Username=dev;Password=dev"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
